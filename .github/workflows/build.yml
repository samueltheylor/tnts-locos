name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-forge:
    name: Java (Forge 1.20.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tnts_forge/**/*.gradle*', 'tnts_forge/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build jar
        working-directory: tnts_forge
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tnts-forge
          path: tnts_forge/build/libs/tnts-*.jar

  build-addon:
    name: Bedrock addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg (sonidos)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build addon
        run: |
          cd tnts_locos 2>/dev/null || true
          # gen_sounds copia .ogg al RP; el build_addon empaqueta
          (cd tnts_forge && python tools/gen_sounds.py)
          python tools/build_addon.py

      - name: Verify structure
        run: |
          python - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('tnts_locos/TNTsLocos.mcaddon')
          names = z.namelist()
          assert any('manifest.json' in n for n in names)
          assert any('scripts/main.js' in n for n in names)
          assert any('black_hole' in n for n in names)
          print(f'OK: {len(names)} archivos en el addon')
          EOF

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: tnts-bedrock
          path: tnts_locos/TNTsLocos.mcaddon
